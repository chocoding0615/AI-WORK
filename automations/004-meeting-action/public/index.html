<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting → Decision & Action</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.desc {
    color: #555;
    margin-top: 0;
    margin-bottom: 24px;
    white-space: pre-line;
  }
  section.card {
    background: #fff;
    border: 1px solid #e2e2e0;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label {
    font-weight: 600;
    font-size: 0.9rem;
    display: block;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  button {
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #analyzeBtn {
    background: #1a1a1a;
    color: #fff;
    width: 100%;
    margin-top: 12px;
  }
  #status {
    margin-top: 14px;
    font-size: 0.95rem;
    color: #444;
  }
  #errorBox {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #fdecec;
    color: #a3241f;
    font-size: 0.92rem;
  }
  #resultSection h2 {
    font-size: 1.15rem;
    margin: 28px 0 10px;
    border-bottom: 2px solid #eee;
    padding-bottom: 6px;
  }
  #resultSection h2:first-of-type {
    margin-top: 0;
  }
  #resultSection ul {
    padding-left: 20px;
    margin: 0;
  }
  #resultSection li {
    margin-bottom: 8px;
  }
  .empty-note {
    color: #888;
    font-size: 0.92rem;
  }
  table.actions-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  table.actions-table th, table.actions-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
  }
  table.actions-table th {
    color: #555;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .unknown {
    color: #a3241f;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-row button {
    background: #f0f0ee;
    color: #1a1a1a;
    border: 1px solid #ddd;
  }
  #copyFeedback {
    font-size: 0.85rem;
    color: #2a7a2a;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Meeting → Decision & Action</h1>
  <p class="desc">회의 내용을 붙여넣으면 결정사항, 해야 할 일(담당자/기한), 확인이
필요한 사항을 정리합니다.</p>

  <section class="card">
    <label for="meetingText">회의 내용</label>
    <textarea id="meetingText" placeholder="회의록 또는 회의 녹취 텍스트를 붙여넣으세요."></textarea>
    <button id="analyzeBtn" type="button">회의 결과 정리하기</button>
    <p id="status" hidden></p>
    <div id="errorBox" hidden></div>
  </section>

  <section class="card" id="resultCard" hidden>
    <div id="resultSection"></div>
    <div class="btn-row">
      <button id="copyBtn" type="button">결과 복사</button>
      <span id="copyFeedback" hidden>복사되었습니다.</span>
    </div>
  </section>
</main>

<script>
(function () {
  var textArea = document.getElementById('meetingText');
  var analyzeBtn = document.getElementById('analyzeBtn');
  var statusEl = document.getElementById('status');
  var errorBox = document.getElementById('errorBox');
  var resultCard = document.getElementById('resultCard');
  var resultSection = document.getElementById('resultSection');
  var copyBtn = document.getElementById('copyBtn');
  var copyFeedback = document.getElementById('copyFeedback');

  var UNKNOWN_LABEL = '확인 필요';
  var isAnalyzing = false;
  var lastPlainText = null;

  function showError(msg) {
    errorBox.hidden = false;
    errorBox.textContent = msg;
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function setBusy(busy) {
    isAnalyzing = busy;
    analyzeBtn.disabled = busy;
    textArea.disabled = busy;
    statusEl.hidden = !busy;
    if (busy) statusEl.textContent = '회의 내용을 정리하고 있습니다... (10~30초 정도 걸릴 수 있습니다)';
  }

  function renderResult(result) {
    resultSection.innerHTML = '';

    var h2d = document.createElement('h2');
    h2d.textContent = '결정사항';
    resultSection.appendChild(h2d);
    if (result.decisions.length === 0) {
      var pd = document.createElement('p');
      pd.className = 'empty-note';
      pd.textContent = '결정사항 없음';
      resultSection.appendChild(pd);
    } else {
      var uld = document.createElement('ul');
      result.decisions.forEach(function (d) {
        var li = document.createElement('li');
        li.textContent = d.content;
        uld.appendChild(li);
      });
      resultSection.appendChild(uld);
    }

    var h2a = document.createElement('h2');
    h2a.textContent = '해야 할 일';
    resultSection.appendChild(h2a);
    if (result.actions.length === 0) {
      var pa = document.createElement('p');
      pa.className = 'empty-note';
      pa.textContent = '해야 할 일 없음';
      resultSection.appendChild(pa);
    } else {
      var table = document.createElement('table');
      table.className = 'actions-table';
      var thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>할 일</th><th>담당</th><th>기한</th></tr>';
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      result.actions.forEach(function (a) {
        var tr = document.createElement('tr');
        var tdTask = document.createElement('td');
        tdTask.textContent = a.task;
        var tdOwner = document.createElement('td');
        tdOwner.textContent = a.owner || UNKNOWN_LABEL;
        if (!a.owner) tdOwner.className = 'unknown';
        var tdDue = document.createElement('td');
        tdDue.textContent = a.dueDate || UNKNOWN_LABEL;
        if (!a.dueDate) tdDue.className = 'unknown';
        tr.appendChild(tdTask);
        tr.appendChild(tdOwner);
        tr.appendChild(tdDue);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      resultSection.appendChild(table);
    }

    var h2o = document.createElement('h2');
    h2o.textContent = '확인 필요';
    resultSection.appendChild(h2o);
    if (result.openIssues.length === 0) {
      var po = document.createElement('p');
      po.className = 'empty-note';
      po.textContent = '확인이 필요한 사항 없음';
      resultSection.appendChild(po);
    } else {
      var ulo = document.createElement('ul');
      result.openIssues.forEach(function (o) {
        var li = document.createElement('li');
        li.textContent = o.content;
        ulo.appendChild(li);
      });
      resultSection.appendChild(ulo);
    }
  }

  analyzeBtn.addEventListener('click', function () {
    if (isAnalyzing) return;
    clearError();
    resultCard.hidden = true;

    var text = textArea.value.trim();
    if (!text) {
      showError('회의 내용을 입력해주세요.');
      return;
    }

    setBusy(true);

    fetch('analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ text: text }),
    }).then(function (res) {
      return res.json();
    }).then(function (data) {
      if (!data.ok) {
        showError(data.message || '분석 중 오류가 발생했습니다.');
        return;
      }
      lastPlainText = data.plainText;
      renderResult(data.result);
      resultCard.hidden = false;
    }).catch(function () {
      showError('서버와 통신 중 오류가 발생했습니다.');
    }).finally(function () {
      setBusy(false);
    });
  });

  copyBtn.addEventListener('click', function () {
    if (!lastPlainText) return;
    navigator.clipboard.writeText(lastPlainText).then(function () {
      copyFeedback.hidden = false;
      setTimeout(function () { copyFeedback.hidden = true; }, 2000);
    }).catch(function () {
      showError('복사에 실패했습니다.');
    });
  });
})();
</script>
</body>
</html>
